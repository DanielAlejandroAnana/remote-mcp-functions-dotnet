# Docs for the Azure Functions Deploy action:
# https://github.com/Azure/functions-action
# More GitHub Actions for Azure:
# https://github.com/Azure/actions

name: Build and deploy FunctionsMcpTool to Azure Function App - FunctionMcpServer

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub Action
        uses: actions/checkout@v4

      - name: Setup DotNet ${{ env.DOTNET_VERSION }} Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build FunctionsMcpTool
        shell: bash
        run: |
          dotnet publish ./src/FunctionsMcpTool/FunctionsMcpTool.csproj \
            --configuration Release \
            --output ./output

      - name: Run Azure Functions Action
        uses: Azure/functions-action@v1
        id: fa
        with:
          app-name: 'func-qpceol5ze5lfw'
          slot-name: 'Production'
          package: './output'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_239ACF12B4B640E8BA0ED55A94A0BAB8 }}